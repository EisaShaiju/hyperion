name: Hyperion CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up subsequent runs

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit pytest pytest-asyncio structlog pydantic

    - name: Run Pre-commit Hooks
      run: pre-commit run --all-files

    - name: Run Unit Tests
      # We will create the tests folder soon, but this prepares the pipeline
      run: |
        mkdir -p tests/unit
        pytest tests/unit/